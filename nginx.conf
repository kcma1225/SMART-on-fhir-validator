events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 80;

    # Convenience: bare "/" redirects into the app under the base path.
    # Target is login.html (never exactly "/") so it can't loop when BASE_PATH is empty.
    location = / {
      return 302 ${BASE_PATH}/login.html;
    }

    # API — strips the "${BASE_PATH}/api/" prefix so the backend still sees "/...".
    location ${BASE_PATH}/api/ {
      proxy_pass         http://validator:${API_PORT}/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    # Static UI served under the configured base path (empty = root).
    location ${BASE_PATH}/ {
      alias /usr/share/nginx/html/;
      index login.html;
      try_files $uri $uri/ ${BASE_PATH}/login.html;

      # Inject the base path into served HTML (read by ui.js as window.BASE_PATH).
      sub_filter '@@BASE_PATH@@' '${BASE_PATH}';
      sub_filter_once off;
      sub_filter_types text/html;
    }
  }
}
