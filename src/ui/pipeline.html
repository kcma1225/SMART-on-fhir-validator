<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Pipeline — IUA/SMART Validator</title>
  <script>window.BASE_PATH='@@BASE_PATH@@';</script>
  <script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="ui.js?v=4"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
  <div id="tip" style="display:none;position:fixed;z-index:9999;pointer-events:none;max-width:600px;word-break:break-all"
    class="bg-gray-900 text-white text-xs rounded px-2.5 py-1.5 shadow-lg leading-relaxed"></div>

  <div data-app-nav="pipeline"></div>

  <div class="max-w-4xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-1 dark:text-gray-100">OAuth Pipeline Inspect</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">輸入 <span class="font-semibold text-purple-600 dark:text-purple-400">Pipeline</span> Share Token，聚合同一條 OAuth 流程的所有 Connection 一起檢視。</p>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-5 mb-4">
      <label class="flex items-center gap-1.5 text-xs font-semibold text-purple-600 dark:text-purple-400 mb-1">
        Pipeline Share Token
        <span id="tip-trigger"
          class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-purple-100 dark:bg-purple-900 text-purple-600 dark:text-purple-300 text-xs font-bold cursor-default select-none">!</span>
      </label>
      <input type="text" id="pipeline-token" placeholder="輸入 Pipeline Share Token 或完整網址（…/view/op/…）…"
        class="w-full border-2 border-purple-300 dark:border-purple-600 rounded px-3 py-2 text-sm font-mono bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500">

      <div id="status-row" style="display:none" class="mt-3 flex items-center gap-2 text-sm text-gray-400 dark:text-gray-500">
        <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        聚合驗證中…
      </div>
      <p id="error-msg" class="text-red-600 dark:text-red-400 text-sm mt-2 hidden"></p>
    </div>

    <!-- Result section -->
    <div id="result-section" class="hidden">
      <!-- Pipeline summary -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-200">Pipeline</h3>
          <div id="pl-flags" class="flex items-center gap-1.5"></div>
        </div>
        <div class="space-y-2.5">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-32 flex-shrink-0">Pipeline ID</span>
            <span id="pl-id" class="font-mono text-sm text-gray-800 dark:text-gray-200 truncate"></span>
          </div>
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-32 flex-shrink-0">Share Token</span>
            <div class="flex items-center gap-1 min-w-0">
              <span id="pl-token" class="font-mono text-sm text-gray-800 dark:text-gray-200 truncate"></span>
              <a id="pl-token-link" href="#" target="_blank" rel="noopener"
                class="flex-shrink-0 p-0.5 rounded text-gray-400 hover:text-purple-500 dark:hover:text-purple-400 transition-colors hidden" title="在 Prism 查看 Pipeline">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </a>
            </div>
          </div>
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-32 flex-shrink-0">Access Token</span>
            <span id="pl-access" class="font-mono text-xs text-gray-600 dark:text-gray-300 truncate"></span>
          </div>
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-32 flex-shrink-0">Participant / Server</span>
            <span id="pl-meta" class="text-xs text-gray-600 dark:text-gray-300 truncate"></span>
          </div>
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-32 flex-shrink-0">Issued / Calls</span>
            <span id="pl-issued" class="text-xs text-gray-600 dark:text-gray-300 truncate"></span>
          </div>
        </div>
      </div>

      <!-- Standard toggle -->
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs text-gray-500 dark:text-gray-400">驗證標準</span>
        <div class="inline-flex rounded-lg border border-gray-300 dark:border-gray-600 overflow-hidden">
          <button type="button" data-std="SMART" onclick="selectStandard('SMART')" class="std-btn px-4 py-1.5 text-sm font-semibold transition">SMART</button>
          <button type="button" data-std="IUA" onclick="selectStandard('IUA')" class="std-btn px-4 py-1.5 text-sm font-semibold border-l border-gray-300 dark:border-gray-600 transition">IUA</button>
        </div>
        <span id="pl-summary" class="ml-auto text-xs text-gray-500 dark:text-gray-400"></span>
      </div>

      <!-- Connection cards -->
      <div id="pl-connections" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = withBase('/login.html');

    async function apiFetch(url, opts = {}) {
      const res = await fetch(withBase('/api' + url), {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
      });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = withBase('/login.html'); return null; }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error ?? 'API request failed');
      return data;
    }
    async function logout() {
      await apiFetch('/auth/logout', { method: 'POST' });
      localStorage.removeItem('token'); location.href = withBase('/login.html');
    }

    // Tooltip (delegated globally so dynamic connection cards work too)
    const tipEl = document.getElementById('tip');
    function moveTip(e) {
      const pad = 12; let x = e.clientX + pad, y = e.clientY + pad;
      const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    }
    document.body.addEventListener('mouseover', e => {
      const s = e.target.closest('[data-tip]'); if (s) { tipEl.textContent = s.dataset.tip; tipEl.style.display = 'block'; moveTip(e); }
    });
    document.body.addEventListener('mousemove', e => {
      if (tipEl.style.display === 'none' || !e.target.closest('[data-tip]')) return; moveTip(e);
    });
    document.body.addEventListener('mouseout', e => {
      if (e.target.closest('[data-tip]')) tipEl.style.display = 'none';
    });
    const tipTrigger = document.getElementById('tip-trigger');
    tipTrigger.dataset.tip = '貼上 Pipeline 的 Share Token 或 …/view/op/{token} 網址';

    let SHARE_URL_PREFIX = '';
    function extractToken(raw) {
      return SHARE_URL_PREFIX && raw.startsWith(SHARE_URL_PREFIX) ? raw.slice(SHARE_URL_PREFIX.length) : raw;
    }

    const COPY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const CHECK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-500" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;

    async function copyValueBtn(btn) {
      const text = btn.dataset.copy ?? '';
      try {
        if (navigator.clipboard) { await navigator.clipboard.writeText(text); }
        else {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
        }
      } catch {}
      btn.innerHTML = CHECK_SVG;
      setTimeout(() => { btn.innerHTML = COPY_SVG; }, 1500);
    }

    const DETAIL_ICONS = {
      field:   `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-500 dark:text-red-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2" fill="none"/><line x1="9" y1="12" x2="15" y2="12"/></svg>`,
      header:  `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500 dark:text-blue-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h10M7 11h6m-9 8h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/><line x1="16" y1="14" x2="20" y2="18" stroke-linecap="round"/><line x1="20" y1="14" x2="16" y2="18" stroke-linecap="round"/></svg>`,
      pattern: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-purple-500 dark:text-purple-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/><line x1="8" y1="11" x2="14" y2="11" stroke-linecap="round"/><line x1="11" y1="8" x2="11" y2="14" stroke-linecap="round"/></svg>`,
    };
    function detailIcon(d) {
      if (!d) return '';
      const icon = d.includes('does not match pattern') ? DETAIL_ICONS.pattern
                 : d.startsWith('header not present') ? DETAIL_ICONS.header
                 : DETAIL_ICONS.field;
      return `<span data-tip="${escapeAttr(d)}" class="inline-flex items-center cursor-default flex-shrink-0">${icon}</span>`;
    }

    const STATUS_COLOR = {
      PASS: 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300',
      FAIL: 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300',
      SKIP: 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400',
    };

    const ROLE_META = {
      token_issue: { label: 'Token Issue · ITI-71', cls: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300' },
      resource:    { label: 'Resource · ITI-72', cls: 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300' },
      validation:  { label: 'Token Validation', cls: 'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300' },
    };

    let baseUrl = '';
    let debounceTimer = null;
    let currentVersion = 0;
    let currentData = null;
    let selectedStandard = localStorage.getItem('inspectStandard') || 'SMART';

    function scheduleValidate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(doValidate, 400);
    }
    function setLoading(on) {
      document.getElementById('status-row').style.display = on ? 'flex' : 'none';
      if (on) document.getElementById('error-msg').classList.add('hidden');
    }
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg; el.classList.remove('hidden');
      setLoading(false);
      document.getElementById('result-section').classList.add('hidden');
    }

    async function doValidate() {
      const raw = document.getElementById('pipeline-token').value.trim();
      const shareToken = raw ? extractToken(raw) : '';
      if (!shareToken) {
        setLoading(false);
        document.getElementById('error-msg').classList.add('hidden');
        document.getElementById('result-section').classList.add('hidden');
        return;
      }
      const version = ++currentVersion;
      setLoading(true);
      try {
        const data = await apiFetch('/pipeline/validate', { method: 'POST', body: JSON.stringify({ shareToken }) });
        if (version !== currentVersion || !data) return;
        renderResult(data);
      } catch (err) {
        if (version !== currentVersion) return;
        showError(err.message);
      }
    }

    function selectStandard(std) {
      selectedStandard = std;
      localStorage.setItem('inspectStandard', std);
      if (currentData) { renderStandardTabs(); renderConnections(); }
    }
    function renderStandardTabs() {
      document.querySelectorAll('.std-btn').forEach(btn => {
        const active = btn.dataset.std === selectedStandard;
        const base = 'std-btn px-4 py-1.5 text-sm font-semibold transition' + (btn.dataset.std === 'IUA' ? ' border-l border-gray-300 dark:border-gray-600' : '');
        const activeColor = btn.dataset.std === 'IUA' ? ' bg-purple-600 text-white' : ' bg-blue-600 text-white';
        btn.className = base + (active
          ? activeColor
          : ' bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600');
      });
    }

    function flagBadge(label, on) {
      const cls = on
        ? 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300'
        : 'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400';
      return `<span class="px-2 py-0.5 rounded text-xs font-medium ${cls}">${escapeHtml(label)}</span>`;
    }

    function renderResult(data) {
      setLoading(false);
      currentData = data;
      const p = data.pipeline;

      document.getElementById('pl-id').textContent = p.id;
      document.getElementById('pl-token').textContent = p.shareToken;
      const tokenLink = document.getElementById('pl-token-link');
      if (baseUrl && p.shareToken) {
        tokenLink.href = `${baseUrl}/view/op/${encodeURIComponent(p.shareToken)}`;
        tokenLink.classList.remove('hidden');
      } else {
        tokenLink.classList.add('hidden');
      }
      document.getElementById('pl-access').textContent = p.accessTokenPreview || '—';
      document.getElementById('pl-meta').textContent =
        `user ${p.participantUserId ?? '—'} · auth server ${p.authenticationServerId ?? '—'}`;
      const issued = p.issuedAt ? new Date(p.issuedAt).toLocaleString() : '—';
      document.getElementById('pl-issued').textContent = `${issued} · ${p.resourceCallCount} resource call(s)`;
      document.getElementById('pl-flags').innerHTML =
        flagBadge('complete', p.complete) + flagBadge('legal', p.legal) + flagBadge('success', p.success);

      renderStandardTabs();
      renderConnections();
      document.getElementById('result-section').classList.remove('hidden');
    }

    function renderConnections() {
      const wrap = document.getElementById('pl-connections');
      const conns = currentData.connections || [];

      let totalFail = 0, totalChecked = 0;
      const html = conns.map((c, idx) => {
        const validation = (c.validations || []).find(v => v.standard === selectedStandard)
          || { flowStep: 'unknown', results: [] };
        // Pipeline view only lists required fields; optional/conditional are hidden.
        const results = (validation.results || []).filter(r => r.required);
        const failCount = results.filter(r => r.status === 'FAIL').length;
        totalFail += failCount;
        totalChecked += results.length;

        const role = ROLE_META[c.role] || { label: c.role, cls: 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300' };

        const tv = c.tokenValidation;
        const isTokenVal = c.role === 'validation' && !!tv;

        let overall;
        if (isTokenVal) {
          if (!tv.checked) {
            overall = '<span class="px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400">—</span>';
          } else if (tv.valid) {
            overall = '<span class="px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300">VALID</span>';
          } else {
            overall = '<span class="px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300">INVALID</span>';
          }
        } else if (results.length === 0) {
          overall = '<span class="px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400">—</span>';
        } else if (failCount === 0) {
          overall = '<span class="px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300">PASS</span>';
        } else {
          overall = `<span class="px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300">FAIL ${failCount}/${results.length}</span>`;
        }

        let bodyHtml;
        if (isTokenVal) {
          bodyHtml = renderTokenValidation(tv);
        } else {
          bodyHtml = renderFieldTable(results, c);
        }

        const urlTip = c.reqUrl ? `<span data-tip="${escapeAttr(c.reqUrl)}" class="flex-shrink-0 inline-flex items-center justify-center w-4 h-4 rounded-full bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 text-xs font-bold cursor-default select-none">!</span>` : '';

        const connLink = (baseUrl && c.shareToken)
          ? `<a href="${baseUrl}/view/c/${encodeURIComponent(c.shareToken)}" target="_blank" rel="noopener" class="text-gray-400 hover:text-blue-500 dark:hover:text-blue-400" title="在 Prism 查看 Connection"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>`
          : '';

        return `<div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-mono text-gray-400 dark:text-gray-500">#${idx + 1}</span>
              <span class="px-2 py-0.5 rounded text-xs font-medium ${role.cls}">${escapeHtml(role.label)}</span>
              <span class="px-1.5 py-0.5 rounded text-xs font-mono font-semibold bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">${escapeHtml(c.reqMethod || '')}</span>
              <span class="font-mono text-sm font-semibold text-blue-700 dark:text-blue-400">${escapeHtml(isTokenVal ? 'token_validation' : validation.flowStep)}</span>
              ${urlTip}
              <span class="ml-auto">${overall}</span>
            </div>
            <div class="flex items-center gap-2 mt-1.5 text-xs text-gray-400 dark:text-gray-500 font-mono min-w-0">
              <span class="truncate">${escapeHtml(c.connectionId)}</span>
              ${connLink}
            </div>
          </div>
          ${bodyHtml}
        </div>`;
      }).join('');

      wrap.innerHTML = html || '<div class="text-center text-gray-400 dark:text-gray-500 py-8">此 Pipeline 沒有任何 Connection</div>';

      const summary = document.getElementById('pl-summary');
      if (conns.length === 0) {
        summary.textContent = '';
      } else if (totalChecked === 0) {
        summary.textContent = `${conns.length} connection(s) · 無欄位驗證`;
      } else if (totalFail === 0) {
        summary.innerHTML = `<span class="text-green-600 dark:text-green-400 font-semibold">${conns.length} connection(s) · 全部 PASS</span>`;
      } else {
        summary.innerHTML = `<span class="text-red-600 dark:text-red-400 font-semibold">${conns.length} connection(s) · ${totalFail} 個欄位 FAIL</span>`;
      }
    }

    function renderTokenValidation(tv) {
      if (!tv.checked) {
        return `<div class="px-4 py-4 text-sm text-gray-400 dark:text-gray-500">${escapeHtml(tv.detail)}</div>`;
      }
      const ok = tv.valid;
      const banner = ok
        ? 'bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300 border-green-200 dark:border-green-800'
        : 'bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 border-red-200 dark:border-red-800';
      const activeText = tv.active === null ? '—' : String(tv.active);
      const matchedChips = tv.matched.map(c =>
        `<span class="px-1.5 py-0.5 rounded text-xs font-mono bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300">${escapeHtml(c)}</span>`).join(' ');
      const mismatchedChips = tv.mismatched.map(c =>
        `<span class="px-1.5 py-0.5 rounded text-xs font-mono bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300">${escapeHtml(c)}</span>`).join(' ');
      return `<div class="p-4 space-y-3">
        <div class="rounded-lg border ${banner} px-3 py-2 text-sm font-medium">
          ${ok ? '✓ Token 有效 — 請求 JWT 解碼後與 introspection 回應一致' : '✗ Token 驗證未通過'}
          <div class="text-xs font-normal mt-0.5 opacity-90">${escapeHtml(tv.detail)}</div>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <span class="text-gray-500 dark:text-gray-400 w-28 flex-shrink-0">回應 active</span>
          <span class="font-mono ${tv.active === false ? 'text-red-600 dark:text-red-400' : 'text-gray-700 dark:text-gray-300'}">${escapeHtml(activeText)}</span>
        </div>
        <div class="flex items-start gap-2 text-xs">
          <span class="text-gray-500 dark:text-gray-400 w-28 flex-shrink-0 mt-0.5">相符 claim (${tv.matched.length})</span>
          <div class="flex flex-wrap gap-1">${matchedChips || '<span class="text-gray-400">—</span>'}</div>
        </div>
        ${tv.mismatched.length ? `<div class="flex items-start gap-2 text-xs">
          <span class="text-gray-500 dark:text-gray-400 w-28 flex-shrink-0 mt-0.5">不符 claim (${tv.mismatched.length})</span>
          <div class="flex flex-wrap gap-1">${mismatchedChips}</div>
        </div>` : ''}
      </div>`;
    }

    function renderFieldTable(results, c) {
      let rowsHtml;
      if (results.length === 0) {
        const isWellKnown = (c.reqUrl || '').includes('/.well-known/');
        const emptyMsg = (isWellKnown && selectedStandard !== 'SMART')
          ? `${selectedStandard} 不驗證 well-known（metadata）端點`
          : '無欄位結果（unknown flow）';
        rowsHtml = `<tr><td colspan="5" class="px-3 py-4 text-center text-gray-400 dark:text-gray-500">${escapeHtml(emptyMsg)}</td></tr>`;
      } else {
        rowsHtml = results.map(r => {
            const statusCell = `<div class="flex items-center gap-1">
              <span class="flex-shrink-0 px-2 py-0.5 rounded text-xs font-medium ${STATUS_COLOR[r.status] || ''}">${escapeHtml(r.status)}</span>
              ${detailIcon(r.detail)}
            </div>`;
            let valueInner;
            if (r.value === undefined) {
              valueInner = '<span class="text-gray-300 dark:text-gray-600 text-xs">—</span>';
            } else if (r.value === '') {
              valueInner = '<span class="text-red-500 dark:text-red-400 font-mono text-xs font-semibold italic">[Empty]</span>';
            } else {
              valueInner = `<button onclick="copyValueBtn(this)" data-copy="${escapeAttr(r.value)}"
                  class="flex-shrink-0 p-0.5 rounded text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 transition-colors mt-0.5" title="複製">${COPY_SVG}</button>
                <span class="font-mono text-xs text-gray-700 dark:text-gray-300 whitespace-nowrap">${escapeHtml(r.value)}</span>`;
            }
            return `<tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
              <td class="px-3 py-2 font-mono font-semibold text-sm dark:text-gray-200">${escapeHtml(r.field)}</td>
              <td class="px-3 py-2 text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap">${escapeHtml(r.location)}</td>
              <td class="px-3 py-2 text-center text-gray-600 dark:text-gray-400">${r.required ? '✓' : ''}</td>
              <td class="px-3 py-2 whitespace-nowrap">${statusCell}</td>
              <td class="px-3 py-2"><div class="flex items-center gap-1.5">${valueInner}</div></td>
            </tr>`;
          }).join('');
      }

      return `<div class="overflow-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs uppercase">
            <tr>
              <th class="px-3 py-2 text-left">Field</th>
              <th class="px-3 py-2 text-left">Location</th>
              <th class="px-3 py-2 text-center">Req</th>
              <th class="px-3 py-2 text-center">Status</th>
              <th class="px-3 py-2 text-left w-96">Value</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 dark:divide-gray-700">${rowsHtml}</tbody>
        </table>
      </div>`;
    }

    async function init() {
      const buResult = await apiFetch('/settings/base-url').catch(() => null);
      if (buResult?.baseUrl) { baseUrl = buResult.baseUrl; SHARE_URL_PREFIX = baseUrl + '/view/op/'; }

      const params = new URLSearchParams(location.search);
      const paramToken = params.get('shareToken') || params.get('pipeline');
      if (paramToken) {
        document.getElementById('pipeline-token').value = paramToken;
        doValidate();
      }
    }

    document.getElementById('pipeline-token').addEventListener('input', scheduleValidate);
    init();
  </script>
</body>
</html>
