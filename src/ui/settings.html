<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Settings — IUA/SMART Validator</title>
  <script>window.BASE_PATH='@@BASE_PATH@@';</script>
  <script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="ui.js?v=3"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
  <div data-app-nav="settings"></div>

  <div class="max-w-4xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-4 dark:text-gray-100">系統設定</h2>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-5 mb-5">
      <div class="flex items-start justify-between gap-4 mb-4">
        <div>
          <h3 class="font-semibold text-lg dark:text-gray-100">Prism Database</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">設定外部 Prism proxy 的 PostgreSQL 連線字串。連線測試成功後，polling 才會開始抓取資料。</p>
        </div>
        <span id="status-badge" class="px-2 py-1 rounded text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">載入中</span>
      </div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Database URL</label>
      <input type="password" id="db-url" autocomplete="off" spellcheck="false"
        placeholder="postgresql://user:password@host:5432/database?sslmode=disable"
        class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm font-mono bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div class="flex items-center gap-3 mt-4">
        <button onclick="testAndSave()" id="test-btn" class="bg-blue-600 text-white px-5 py-2 rounded text-sm font-medium hover:bg-blue-700 transition">測試連線並儲存</button>
        <button onclick="toggleUrlVisibility()" type="button" class="border border-gray-300 dark:border-gray-600 px-4 py-2 rounded text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition">顯示/隱藏</button>
      </div>
      <p id="verified-at" class="text-xs text-gray-500 dark:text-gray-400 mt-4"></p>
      <p id="message" class="text-sm mt-3 hidden"></p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-5 mb-5">
      <div class="mb-4">
        <h3 class="font-semibold text-lg dark:text-gray-100">Prism Base URL</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">設定 Prism 系統的網址，Results 頁面的 Connection ID 將連結至 <code class="bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-1 rounded">{baseUrl}/connections/{id}</code>。</p>
      </div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Base URL</label>
      <input type="text" id="base-url" autocomplete="off" spellcheck="false" placeholder="https://prism.example.com"
        class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm font-mono bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div class="flex items-center gap-3 mt-4">
        <button onclick="saveBaseUrl()" id="base-url-btn" class="bg-blue-600 text-white px-5 py-2 rounded text-sm font-medium hover:bg-blue-700 transition">儲存</button>
      </div>
      <p id="base-url-message" class="text-sm mt-3 hidden"></p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-5">
      <div class="mb-4">
        <h3 class="font-semibold text-lg dark:text-gray-100">Polling</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">設定 validator 自動從 Prism database 抓取 connections 的排程。</p>
      </div>
      <div class="grid md:grid-cols-3 gap-4">
        <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
          <input type="checkbox" id="polling-enabled" class="rounded border-gray-300 dark:border-gray-600">
          啟用 Polling
        </label>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Interval Seconds</label>
          <input type="number" id="polling-interval" min="5" max="3600"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Batch Size</label>
          <input type="number" id="polling-batch" min="1" max="1000"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
      <div class="flex items-center gap-3 mt-4">
        <button onclick="savePolling()" id="polling-save-btn" class="bg-blue-600 text-white px-5 py-2 rounded text-sm font-medium hover:bg-blue-700 transition">儲存 Polling 設定</button>
      </div>
      <p id="polling-message" class="text-sm mt-3 hidden"></p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = withBase('/login.html');

    async function apiFetch(url, opts = {}) {
      const res = await fetch(withBase('/api' + url), { ...opts, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers } });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = withBase('/login.html'); return null; }
      return { ok: res.ok, data: await res.json() };
    }
    async function logout() { await apiFetch('/auth/logout', { method: 'POST' }); localStorage.removeItem('token'); location.href = withBase('/login.html'); }

    function setStatus(isVerified) {
      const b = document.getElementById('status-badge');
      b.textContent = isVerified ? '已通過測試' : '未通過測試';
      b.className = `px-2 py-1 rounded text-xs font-medium ${isVerified ? 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300' : 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300'}`;
    }
    function setMessage(text, ok) { const e = document.getElementById('message'); e.textContent = text; e.className = `text-sm mt-3 ${ok ? 'text-green-700 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`; }
    function setPollingMessage(text, ok) { const e = document.getElementById('polling-message'); e.textContent = text; e.className = `text-sm mt-3 ${ok ? 'text-green-700 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`; }
    function setBaseUrlMessage(text, ok) { const e = document.getElementById('base-url-message'); e.textContent = text; e.className = `text-sm mt-3 ${ok ? 'text-green-700 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`; }
    function setVerifiedAt(iso) { document.getElementById('verified-at').textContent = iso ? `最後成功測試：${new Date(iso).toLocaleString('zh-TW')}` : '尚未完成連線測試。'; }
    function toggleUrlVisibility() { const i = document.getElementById('db-url'); i.type = i.type === 'password' ? 'text' : 'password'; }

    async function loadSettings() {
      const [db, poll, bu] = await Promise.all([apiFetch('/settings/prism-db'), apiFetch('/settings/polling'), apiFetch('/settings/base-url')]);
      if (db) { document.getElementById('db-url').value = db.data.url ?? ''; setStatus(db.data.isVerified); setVerifiedAt(db.data.verifiedAt); }
      if (poll) { document.getElementById('polling-enabled').checked = Boolean(poll.data.enabled); document.getElementById('polling-interval').value = poll.data.intervalSeconds; document.getElementById('polling-batch').value = poll.data.batchSize; }
      if (bu) document.getElementById('base-url').value = bu.data.baseUrl ?? '';
    }

    async function testAndSave() {
      const input = document.getElementById('db-url'), btn = document.getElementById('test-btn'), url = input.value.trim();
      if (!url) { setMessage('Database URL 不可為空。', false); return; }
      btn.disabled = true; btn.textContent = '測試中...';
      const result = await apiFetch('/settings/prism-db/test', { method: 'POST', body: JSON.stringify({ url }) });
      btn.disabled = false; btn.textContent = '測試連線並儲存';
      if (!result) return;
      if (!result.ok) { setStatus(false); setVerifiedAt(null); setMessage(result.data?.error ?? '連線測試失敗。', false); return; }
      input.value = result.data.url ?? url; setStatus(true); setVerifiedAt(result.data.verifiedAt);
      setMessage('連線測試成功，設定已儲存。Polling 將使用此 Prism database。', true);
    }

    async function saveBaseUrl() {
      const btn = document.getElementById('base-url-btn');
      btn.disabled = true; btn.textContent = '儲存中...';
      const result = await apiFetch('/settings/base-url', { method: 'PUT', body: JSON.stringify({ baseUrl: document.getElementById('base-url').value }) });
      btn.disabled = false; btn.textContent = '儲存';
      if (!result) return;
      if (!result.ok) { setBaseUrlMessage(result.data?.error ?? '儲存失敗。', false); return; }
      document.getElementById('base-url').value = result.data.baseUrl ?? '';
      setBaseUrlMessage('Base URL 已儲存。', true);
    }

    async function savePolling() {
      const btn = document.getElementById('polling-save-btn');
      btn.disabled = true; btn.textContent = '儲存中...';
      const result = await apiFetch('/settings/polling', { method: 'PUT', body: JSON.stringify({ enabled: document.getElementById('polling-enabled').checked, intervalSeconds: Number(document.getElementById('polling-interval').value), batchSize: Number(document.getElementById('polling-batch').value) }) });
      btn.disabled = false; btn.textContent = '儲存 Polling 設定';
      if (!result) return;
      if (!result.ok) { setPollingMessage(result.data?.error ?? 'Polling 設定儲存失敗。', false); return; }
      document.getElementById('polling-enabled').checked = Boolean(result.data.settings.enabled);
      document.getElementById('polling-interval').value = result.data.settings.intervalSeconds;
      document.getElementById('polling-batch').value = result.data.settings.batchSize;
      setPollingMessage('Polling 設定已儲存並套用。', true);
    }

    loadSettings();
  </script>
</body>
</html>
