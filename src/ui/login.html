<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>IUA/SMART Validator — 登入</title>
  <script>window.BASE_PATH='@@BASE_PATH@@';</script>
  <script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="ui.js?v=3"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center transition-colors duration-200">
  <div data-login-theme-toggle></div>

  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-center mb-1 dark:text-gray-100">IUA/SMART Validator</h1>
    <p class="text-center text-gray-500 dark:text-gray-400 text-sm mb-6">督察員介面</p>
    <form id="login-form">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">帳號</label>
        <input type="text" id="username" autocomplete="username"
          class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">密碼</label>
        <input type="password" id="password" autocomplete="current-password"
          class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <p id="error-msg" class="text-red-600 dark:text-red-400 text-sm mb-3 hidden"></p>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition">登入</button>
    </form>
  </div>

  <script>
    if (localStorage.getItem('token')) location.href = withBase('/dashboard.html');

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');
      try {
        const res = await fetch(withBase('/api/auth/login'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
        if (!res.ok) throw new Error('帳號或密碼錯誤');
        const { token } = await res.json();
        localStorage.setItem('token', token);
        location.href = withBase('/dashboard.html');
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
    });
  </script>
</body>
</html>
