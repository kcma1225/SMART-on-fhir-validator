<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — IUA/SMART Validator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Custom tooltip -->
  <div id="tip" style="display:none;position:fixed;z-index:9999;pointer-events:none;max-width:320px"
    class="bg-gray-900 text-white text-xs rounded px-2.5 py-1.5 shadow-lg leading-relaxed"></div>

  <nav class="bg-gray-800 text-white px-6 py-3 flex items-center gap-6">
    <span class="font-bold">IUA/SMART Validator</span>
    <a href="/dashboard.html" class="hover:text-gray-300">Dashboard</a>
    <a href="/results.html" class="text-blue-300 font-medium">Results</a>
    <a href="/validate.html" class="hover:text-gray-300">Validate</a>
    <a href="/rules.html" class="hover:text-gray-300">Rules</a>
    <a href="/settings.html" class="ml-auto hover:text-gray-300">Settings</a>
    <a href="/test.html" class="hover:text-gray-300">Test</a>
    <button onclick="logout()" class="text-sm hover:text-gray-300">Logout</button>
  </nav>

  <div class="max-w-7xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-4">驗證結果列表</h2>

    <!-- Filters -->
    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <!-- ShareToken row (highest priority) -->
      <div class="mb-3 pb-3 border-b border-gray-100">
        <label class="block text-xs font-semibold text-blue-600 mb-1">ShareToken ID <span class="font-normal text-gray-400">（最高優先，填入後其他 filter 暫停）</span></label>
        <input type="text" id="f-sharetoken" placeholder="輸入 Share Token..."
          oninput="onShareTokenInput()"
          class="w-full border-2 border-blue-300 rounded px-2 py-1.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <!-- Secondary filters -->
      <div id="secondary-filters" class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Connection ID</label>
          <input type="text" id="f-connection" placeholder="全部"
            oninput="debouncedReset()"
            class="w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Server</label>
          <select id="f-server" onchange="resetAndLoad()" class="w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="">全部</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Flow Step</label>
          <select id="f-flowstep" onchange="resetAndLoad()" class="w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="">全部</option>
            <option value="smart_metadata">smart_metadata</option>
            <option value="authorization_request">authorization_request</option>
            <option value="token_request_auth_code">token_request_auth_code</option>
            <option value="token_request_client_cred">token_request_client_cred</option>
            <option value="token_request_refresh">token_request_refresh</option>
            <option value="fhir_request">fhir_request</option>
            <option value="unknown">unknown</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Status</label>
          <select id="f-status" onchange="resetAndLoad()" class="w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="">全部</option>
            <option value="PASS">PASS</option>
            <option value="FAIL">FAIL</option>
            <option value="SKIP">SKIP</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">From</label>
          <input type="datetime-local" id="f-from"
            onchange="resetAndLoad()"
            class="w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">To</label>
          <input type="datetime-local" id="f-to"
            onchange="resetAndLoad()"
            class="w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600 text-xs uppercase">
          <tr>
            <th class="px-3 py-2 text-left">Connection ID</th>
            <th class="px-3 py-2 text-left">Server</th>
            <th class="px-3 py-2 text-left">Flow Step</th>
            <th class="px-3 py-2 text-left">Field</th>
            <th class="px-3 py-2 text-left">Location</th>
            <th class="px-3 py-2 text-center">Req</th>
            <th class="px-3 py-2 text-center">Status</th>
            <th class="px-3 py-2 text-left">Detail</th>
            <th class="px-3 py-2 text-left">Validated At</th>
          </tr>
        </thead>
        <tbody id="results-body" class="divide-y divide-gray-100">
          <tr><td colspan="9" class="px-3 py-6 text-center text-gray-400">按查詢顯示結果</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Infinite scroll sentinel -->
    <div id="scroll-sentinel" class="flex justify-center items-center py-4 min-h-[48px]"></div>
    <p id="result-count" class="text-xs text-gray-400 mb-4"></p>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login.html';

    async function apiFetch(url, opts = {}) {
      const res = await fetch('/api' + url, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
      });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = '/login.html'; return null; }
      return res.json();
    }

    async function logout() {
      await apiFetch('/auth/logout', { method: 'POST' });
      localStorage.removeItem('token');
      location.href = '/login.html';
    }

    const PAGE_SIZE = 50;
    const STATUS_COLOR = { PASS: 'bg-green-100 text-green-700', FAIL: 'bg-red-100 text-red-700', SKIP: 'bg-gray-100 text-gray-600' };
    let baseUrl = '';

    let offset = 0;
    let loading = false;
    let exhausted = false;
    let totalLoaded = 0;

    const SECONDARY_FILTER_IDS = ['f-connection', 'f-server', 'f-flowstep', 'f-status', 'f-from', 'f-to'];

    let debounceTimer = null;
    function debouncedReset() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(resetAndLoad, 400);
    }

    function onShareTokenInput() {
      const active = document.getElementById('f-sharetoken').value.trim() !== '';
      const container = document.getElementById('secondary-filters');
      container.style.opacity = active ? '0.4' : '';
      container.style.pointerEvents = active ? 'none' : '';
      SECONDARY_FILTER_IDS.forEach(id => {
        document.getElementById(id).disabled = active;
      });
      debouncedReset();
    }

    // Load server list into filter dropdown
    async function loadServerOptions() {
      const sel = document.getElementById('f-server');
      try {
        const servers = await apiFetch('/prism/servers');
        if (!servers) return;
        servers.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.name;
          sel.appendChild(opt);
        });
      } catch {
        // Prism DB not connected yet; leave dropdown with just 全部
      }
    }

    function buildParams(currentOffset) {
      const params = new URLSearchParams();
      const shareToken = document.getElementById('f-sharetoken').value.trim();

      if (shareToken) {
        params.set('shareToken', shareToken);
      } else {
        const conn = document.getElementById('f-connection').value.trim();
        const server = document.getElementById('f-server').value;
        const flow = document.getElementById('f-flowstep').value;
        const status = document.getElementById('f-status').value;
        const from = document.getElementById('f-from').value;
        const to = document.getElementById('f-to').value;

        if (conn) params.set('connectionId', conn);
        if (server) params.set('serverId', server);
        if (flow) params.set('flowStep', flow);
        if (status) params.set('status', status);
        if (from) params.set('from', new Date(from).toISOString());
        if (to) params.set('to', new Date(to).toISOString());
      }

      params.set('limit', String(PAGE_SIZE));
      params.set('offset', String(currentOffset));
      return params;
    }

    const DETAIL_ICONS = {
      field: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-500" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" fill="none"/>
        <line x1="9" y1="12" x2="15" y2="12" stroke="currentColor"/>
      </svg>`,
      header: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h10M7 11h6m-9 8h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        <line x1="16" y1="14" x2="20" y2="18" stroke="currentColor" stroke-linecap="round"/>
        <line x1="20" y1="14" x2="16" y2="18" stroke="currentColor" stroke-linecap="round"/>
      </svg>`,
      pattern: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-500" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" stroke="currentColor"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-linecap="round"/>
        <line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-linecap="round"/>
        <line x1="11" y1="8" x2="11" y2="14" stroke="currentColor" stroke-linecap="round"/>
      </svg>`,
    };

    function detailIcon(detail) {
      if (!detail) return '';
      let icon;
      if (detail.startsWith('header present but does not match')) {
        icon = DETAIL_ICONS.pattern;
      } else if (detail.startsWith('header not present')) {
        icon = DETAIL_ICONS.header;
      } else {
        icon = DETAIL_ICONS.field;
      }
      const escaped = detail.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      return `<span data-tip="${escaped}" class="inline-flex items-center cursor-default">${icon}</span>`;
    }

    const tipEl = document.getElementById('tip');

    function showTip(e) {
      const msg = e.currentTarget.dataset.tip;
      if (!msg) return;
      tipEl.textContent = msg;
      tipEl.style.display = 'block';
      moveTip(e);
    }

    function moveTip(e) {
      const pad = 12;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      const w = tipEl.offsetWidth;
      const h = tipEl.offsetHeight;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tipEl.style.left = x + 'px';
      tipEl.style.top  = y + 'px';
    }

    function hideTip() {
      tipEl.style.display = 'none';
    }

    // Event delegation on tbody — handles dynamically inserted rows
    document.getElementById('results-body').addEventListener('mouseover', e => {
      const span = e.target.closest('[data-tip]');
      if (span) { tipEl.textContent = span.dataset.tip; tipEl.style.display = 'block'; }
    });
    document.getElementById('results-body').addEventListener('mousemove', e => {
      if (tipEl.style.display === 'none') return;
      if (!e.target.closest('[data-tip]')) return;
      moveTip(e);
    });
    document.getElementById('results-body').addEventListener('mouseout', e => {
      if (!e.target.closest('[data-tip]')) return;
      hideTip();
    });

    function rowHtml(r) {
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 font-mono text-xs whitespace-nowrap">
            ${baseUrl
              ? `<a href="${baseUrl}/connections/${r.connectionId}" target="_blank" class="text-blue-600 hover:underline">${r.connectionId}</a>`
              : `<span class="text-gray-500" title="${r.connectionId}">${r.connectionId}</span>`
            }
          </td>
          <td class="px-3 py-2 text-xs text-gray-700">${r.serverName ?? '—'}</td>
          <td class="px-3 py-2 text-xs font-mono">${r.flowStep}</td>
          <td class="px-3 py-2 font-mono text-xs font-semibold">${r.fieldName}</td>
          <td class="px-3 py-2 text-xs text-gray-500">${r.fieldLocation}</td>
          <td class="px-3 py-2 text-center">${r.required ? '✓' : ''}</td>
          <td class="px-3 py-2 text-center">
            <span class="px-2 py-0.5 rounded text-xs font-medium ${STATUS_COLOR[r.status] || ''}">${r.status}</span>
          </td>
          <td class="px-3 py-2 text-center">${detailIcon(r.detail)}</td>
          <td class="px-3 py-2 text-xs text-gray-400">${new Date(r.validatedAt).toLocaleString('zh-TW')}</td>
        </tr>`;
    }

    function setSentinel(state) {
      const el = document.getElementById('scroll-sentinel');
      if (state === 'loading') {
        el.innerHTML = `
          <div class="flex items-center gap-2 text-gray-400 text-sm">
            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            載入中…
          </div>`;
      } else if (state === 'end') {
        el.innerHTML = '<p class="text-xs text-gray-400">已顯示全部結果</p>';
      } else {
        el.innerHTML = '';
      }
    }

    async function loadNextPage() {
      if (loading || exhausted) return;
      loading = true;
      setSentinel('loading');

      const data = await apiFetch('/results?' + buildParams(offset).toString());
      loading = false;

      if (!data) return;

      const tbody = document.getElementById('results-body');

      if (offset === 0 && data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="px-3 py-6 text-center text-gray-400">無資料</td></tr>';
        setSentinel('end');
        document.getElementById('result-count').textContent = '共 0 筆';
        return;
      }

      if (offset === 0) {
        tbody.innerHTML = '';
      }

      tbody.insertAdjacentHTML('beforeend', data.map(rowHtml).join(''));
      offset += data.length;
      totalLoaded += data.length;
      document.getElementById('result-count').textContent = `已載入 ${totalLoaded} 筆`;

      if (data.length < PAGE_SIZE) {
        exhausted = true;
        setSentinel('end');
        document.getElementById('result-count').textContent = `共 ${totalLoaded} 筆`;
      } else {
        setSentinel('');
      }
    }

    function resetAndLoad() {
      offset = 0;
      loading = false;
      exhausted = false;
      totalLoaded = 0;
      document.getElementById('results-body').innerHTML =
        '<tr><td colspan="9" class="px-3 py-6 text-center text-gray-400">載入中…</td></tr>';
      document.getElementById('result-count').textContent = '';
      loadNextPage();
    }

    // IntersectionObserver: trigger next page when sentinel enters viewport
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadNextPage();
    }, { rootMargin: '200px' });

    observer.observe(document.getElementById('scroll-sentinel'));

    // Init: load base URL + server options, then trigger first data load
    async function init() {
      const [, baseUrlResult] = await Promise.all([
        loadServerOptions(),
        apiFetch('/settings/base-url'),
      ]);
      if (baseUrlResult?.baseUrl) baseUrl = baseUrlResult.baseUrl;
      resetAndLoad();
    }

    init();
  </script>
</body>
</html>
