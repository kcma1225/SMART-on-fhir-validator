<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — IUA/SMART Validator</title>
  <script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/ui.js?v=2"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
  <div id="tip" style="display:none;position:fixed;z-index:9999;pointer-events:none;max-width:320px"
    class="bg-gray-900 text-white text-xs rounded px-2.5 py-1.5 shadow-lg leading-relaxed"></div>

  <div data-app-nav="results"></div>

  <div class="max-w-7xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-4 dark:text-gray-100">驗證結果列表</h2>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 mb-4">
      <div class="mb-3 pb-3 border-b border-gray-100 dark:border-gray-700">
        <label class="flex items-center gap-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 mb-1">
          ShareToken ID
          <span data-tip="最高優先，填入後其他 filter 暫停"
            onmouseenter="showTip(event)" onmousemove="moveTip(event)" onmouseleave="hideTip()"
            class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 text-xs font-bold cursor-default select-none">!</span>
        </label>
        <input type="text" id="f-sharetoken" placeholder="輸入 Share Token..." oninput="onShareTokenInput()"
          class="w-full border-2 border-blue-300 dark:border-blue-600 rounded px-2 py-1.5 text-sm font-mono bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div id="secondary-filters" class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Connection ID</label>
          <input type="text" id="f-connection" placeholder="全部" oninput="debouncedReset()"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Server</label>
          <select id="f-server" onchange="resetAndLoad()"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="">全部</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Flow Step</label>
          <select id="f-flowstep" onchange="resetAndLoad()"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="">全部</option>
            <option value="smart_metadata">smart_metadata</option>
            <option value="authorization_request">authorization_request</option>
            <option value="token_request_auth_code">token_request_auth_code</option>
            <option value="token_request_client_cred">token_request_client_cred</option>
            <option value="token_request_refresh">token_request_refresh</option>
            <option value="fhir_request">fhir_request</option>
            <option value="unknown">unknown</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Status</label>
          <select id="f-status" onchange="resetAndLoad()"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <option value="">全部</option>
            <option value="PASS">PASS</option>
            <option value="FAIL">FAIL</option>
            <option value="SKIP">SKIP</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">From</label>
          <input type="datetime-local" id="f-from" onchange="resetAndLoad()"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">To</label>
          <input type="datetime-local" id="f-to" onchange="resetAndLoad()"
            class="w-full border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs uppercase">
          <tr>
            <th class="px-3 py-2 text-left">Connection ID</th>
            <th class="px-3 py-2 text-left">Server</th>
            <th class="px-3 py-2 text-left">Flow Step</th>
            <th class="px-3 py-2 text-left">Field</th>
            <th class="px-3 py-2 text-left">Location</th>
            <th class="px-3 py-2 text-center">Req</th>
            <th class="px-3 py-2 text-center">Status</th>
            <th class="px-3 py-2 text-left">Detail</th>
            <th class="px-3 py-2 text-left">Validated At</th>
          </tr>
        </thead>
        <tbody id="results-body" class="divide-y divide-gray-100 dark:divide-gray-700">
          <tr><td colspan="9" class="px-3 py-6 text-center text-gray-400 dark:text-gray-500">按查詢顯示結果</td></tr>
        </tbody>
      </table>
    </div>
    <div id="scroll-sentinel" class="flex justify-center items-center py-4 min-h-[48px]"></div>
    <p id="result-count" class="text-xs text-gray-400 dark:text-gray-500 mb-4"></p>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login.html';

    async function apiFetch(url, opts = {}) {
      const res = await fetch('/api' + url, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
      });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = '/login.html'; return null; }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error ?? 'API request failed');
      return data;
    }

    async function logout() {
      await apiFetch('/auth/logout', { method: 'POST' });
      localStorage.removeItem('token');
      location.href = '/login.html';
    }

    const tipEl = document.getElementById('tip');
    function showTip(e) { const m = e.currentTarget.dataset.tip; if (!m) return; tipEl.textContent = m; tipEl.style.display = 'block'; moveTip(e); }
    function moveTip(e) {
      const pad = 12; let x = e.clientX + pad, y = e.clientY + pad;
      const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    }
    function hideTip() { tipEl.style.display = 'none'; }

    document.getElementById('results-body').addEventListener('mouseover', e => {
      const s = e.target.closest('[data-tip]'); if (s) { tipEl.textContent = s.dataset.tip; tipEl.style.display = 'block'; }
    });
    document.getElementById('results-body').addEventListener('mousemove', e => {
      if (tipEl.style.display === 'none' || !e.target.closest('[data-tip]')) return; moveTip(e);
    });
    document.getElementById('results-body').addEventListener('mouseout', e => {
      if (e.target.closest('[data-tip]')) hideTip();
    });

    const PAGE_SIZE = 50;
    const STATUS_COLOR = {
      PASS: 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300',
      FAIL: 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300',
      SKIP: 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400',
    };
    let baseUrl = '', offset = 0, loading = false, exhausted = false, totalLoaded = 0, requestVersion = 0;

    const SECONDARY_FILTER_IDS = ['f-connection', 'f-server', 'f-flowstep', 'f-status', 'f-from', 'f-to'];
    let debounceTimer = null;
    function debouncedReset() { clearTimeout(debounceTimer); debounceTimer = setTimeout(resetAndLoad, 400); }

    function onShareTokenInput() {
      const active = document.getElementById('f-sharetoken').value.trim() !== '';
      const c = document.getElementById('secondary-filters');
      c.style.opacity = active ? '0.4' : ''; c.style.pointerEvents = active ? 'none' : '';
      SECONDARY_FILTER_IDS.forEach(id => { document.getElementById(id).disabled = active; });
      debouncedReset();
    }

    async function loadServerOptions() {
      const sel = document.getElementById('f-server');
      try {
        const servers = await apiFetch('/prism/servers');
        if (!servers) return;
        servers.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
      } catch {}
    }

    function buildParams(o) {
      const p = new URLSearchParams();
      const st = document.getElementById('f-sharetoken').value.trim();
      if (st) { p.set('shareToken', st); } else {
        const conn = document.getElementById('f-connection').value.trim();
        const srv  = document.getElementById('f-server').value;
        const flow = document.getElementById('f-flowstep').value;
        const stat = document.getElementById('f-status').value;
        const from = document.getElementById('f-from').value;
        const to   = document.getElementById('f-to').value;
        if (conn) p.set('connectionId', conn);
        if (srv)  p.set('serverId', srv);
        if (flow) p.set('flowStep', flow);
        if (stat) p.set('status', stat);
        if (from) p.set('from', new Date(from).toISOString());
        if (to)   p.set('to',   new Date(to).toISOString());
      }
      p.set('limit', String(PAGE_SIZE)); p.set('offset', String(o)); return p;
    }

    function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escA(s) { return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

    const ICONS = {
      field:   `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-500 dark:text-red-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2" fill="none"/><line x1="9" y1="12" x2="15" y2="12"/></svg>`,
      header:  `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500 dark:text-blue-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h10M7 11h6m-9 8h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/><line x1="16" y1="14" x2="20" y2="18" stroke-linecap="round"/><line x1="20" y1="14" x2="16" y2="18" stroke-linecap="round"/></svg>`,
      pattern: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-purple-500 dark:text-purple-400" style="pointer-events:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/><line x1="8" y1="11" x2="14" y2="11" stroke-linecap="round"/><line x1="11" y1="8" x2="11" y2="14" stroke-linecap="round"/></svg>`,
    };
    function detailIcon(d) {
      if (!d) return '';
      const icon = d.startsWith('header present but does not match') ? ICONS.pattern : d.startsWith('header not present') ? ICONS.header : ICONS.field;
      return `<span data-tip="${escA(d)}" class="inline-flex items-center cursor-default">${icon}</span>`;
    }

    function rowHtml(r) {
      const cid = String(r.connectionId ?? '');
      const href = baseUrl ? `${baseUrl}/connections/${encodeURIComponent(cid)}` : '';
      return `<tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
        <td class="px-3 py-2 font-mono text-xs whitespace-nowrap">${href
          ? `<a href="${escA(href)}" target="_blank" rel="noopener" class="text-blue-600 dark:text-blue-400 hover:underline">${esc(cid)}</a>`
          : `<span class="text-gray-500 dark:text-gray-400">${esc(cid)}</span>`}</td>
        <td class="px-3 py-2 text-xs text-gray-700 dark:text-gray-300">${esc(r.serverName??'—')}</td>
        <td class="px-3 py-2 text-xs font-mono text-gray-800 dark:text-gray-200">${esc(r.flowStep)}</td>
        <td class="px-3 py-2 font-mono text-xs font-semibold text-gray-900 dark:text-gray-100">${esc(r.fieldName)}</td>
        <td class="px-3 py-2 text-xs text-gray-500 dark:text-gray-400">${esc(r.fieldLocation)}</td>
        <td class="px-3 py-2 text-center text-gray-600 dark:text-gray-400">${r.required?'✓':''}</td>
        <td class="px-3 py-2 text-center"><span class="px-2 py-0.5 rounded text-xs font-medium ${STATUS_COLOR[r.status]||''}">${esc(r.status)}</span></td>
        <td class="px-3 py-2 text-center">${detailIcon(r.detail)}</td>
        <td class="px-3 py-2 text-xs text-gray-400 dark:text-gray-500">${new Date(r.validatedAt).toLocaleString('zh-TW')}</td>
      </tr>`;
    }

    function setSentinel(state) {
      const el = document.getElementById('scroll-sentinel');
      if (state === 'loading') {
        el.innerHTML = `<div class="flex items-center gap-2 text-gray-400 dark:text-gray-500 text-sm"><svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>載入中…</div>`;
      } else if (state === 'end') {
        el.innerHTML = '<p class="text-xs text-gray-400 dark:text-gray-500">已顯示全部結果</p>';
      } else { el.innerHTML = ''; }
    }

    async function loadNextPage(version = requestVersion) {
      if (loading || exhausted) return;
      loading = true; setSentinel('loading');
      let data;
      try { data = await apiFetch('/results?' + buildParams(offset).toString()); }
      catch (err) {
        if (version !== requestVersion) return;
        loading = false; setSentinel('end');
        document.getElementById('results-body').innerHTML = `<tr><td colspan="9" class="px-3 py-6 text-center text-red-500">${esc(err.message)}</td></tr>`;
        return;
      }
      if (version !== requestVersion) return;
      loading = false; if (!data) return;
      const tbody = document.getElementById('results-body');
      if (offset === 0 && data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="px-3 py-6 text-center text-gray-400 dark:text-gray-500">無資料</td></tr>';
        setSentinel('end'); document.getElementById('result-count').textContent = '共 0 筆'; return;
      }
      if (offset === 0) tbody.innerHTML = '';
      tbody.insertAdjacentHTML('beforeend', data.map(rowHtml).join(''));
      offset += data.length; totalLoaded += data.length;
      document.getElementById('result-count').textContent = `已載入 ${totalLoaded} 筆`;
      if (data.length < PAGE_SIZE) {
        exhausted = true; setSentinel('end');
        document.getElementById('result-count').textContent = `共 ${totalLoaded} 筆`;
      } else { setSentinel(''); }
    }

    function resetAndLoad() {
      requestVersion++; offset = 0; loading = false; exhausted = false; totalLoaded = 0;
      document.getElementById('results-body').innerHTML = '<tr><td colspan="9" class="px-3 py-6 text-center text-gray-400 dark:text-gray-500">載入中…</td></tr>';
      document.getElementById('result-count').textContent = '';
      loadNextPage(requestVersion);
    }

    new IntersectionObserver(entries => { if (entries[0].isIntersecting) loadNextPage(); }, { rootMargin: '200px' })
      .observe(document.getElementById('scroll-sentinel'));

    async function init() {
      const [, r] = await Promise.all([loadServerOptions(), apiFetch('/settings/base-url')]);
      if (r?.baseUrl) baseUrl = r.baseUrl;
      resetAndLoad();
    }
    init();
  </script>
</body>
</html>
