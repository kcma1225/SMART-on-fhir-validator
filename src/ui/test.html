<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test — IUA/SMART Validator</title>
  <script>window.BASE_PATH='@@BASE_PATH@@';</script>
  <script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="ui.js?v=3"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
  <div data-app-nav="test"></div>

  <div class="max-w-5xl mx-auto p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold dark:text-gray-100">測試腳本執行</h2>
      <button onclick="runTests()" id="run-btn" class="bg-blue-600 text-white px-5 py-2 rounded font-medium hover:bg-blue-700 transition">執行測試</button>
    </div>

    <div id="summary" class="hidden bg-white dark:bg-gray-800 rounded-lg shadow p-4 mb-4 grid grid-cols-3 gap-4 text-center">
      <div>
        <div id="sum-total" class="text-3xl font-bold text-gray-800 dark:text-gray-100">—</div>
        <div class="text-gray-500 dark:text-gray-400 text-sm">Total</div>
      </div>
      <div>
        <div id="sum-pass" class="text-3xl font-bold text-green-600 dark:text-green-400">—</div>
        <div class="text-gray-500 dark:text-gray-400 text-sm">Passed</div>
      </div>
      <div>
        <div id="sum-fail" class="text-3xl font-bold text-red-600 dark:text-red-400">—</div>
        <div class="text-gray-500 dark:text-gray-400 text-sm">Failed</div>
      </div>
    </div>

    <div id="cases-section" class="space-y-3"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = withBase('/login.html');

    async function apiFetch(url, opts = {}) {
      const res = await fetch(withBase('/api' + url), { ...opts, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers } });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = withBase('/login.html'); return null; }
      return res.json();
    }
    async function logout() { await apiFetch('/auth/logout', { method: 'POST' }); localStorage.removeItem('token'); location.href = withBase('/login.html'); }

    function badge(status) {
      const colors = { PASS: 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300', FAIL: 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300', SKIP: 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400' };
      return `<span class="px-1.5 py-0.5 rounded font-medium ${colors[status]||''}">${escapeHtml(status)}</span>`;
    }

    async function runTests() {
      const btn = document.getElementById('run-btn');
      btn.disabled = true; btn.textContent = '執行中…';
      const report = await apiFetch('/test/run', { method: 'POST' });
      btn.disabled = false; btn.textContent = '執行測試';
      if (!report) return;

      document.getElementById('sum-total').textContent = report.total;
      document.getElementById('sum-pass').textContent = report.passed;
      document.getElementById('sum-fail').textContent = report.failed;
      document.getElementById('summary').classList.remove('hidden');

      document.getElementById('cases-section').innerHTML = report.cases.map(c => {
        const isPass = c.status === 'PASS';
        const flowMatch = c.expectedFlowStep === c.actualFlowStep;
        const fieldsHtml = c.fields.length > 0 ? `
          <table class="w-full text-xs mt-3">
            <thead class="text-gray-500 dark:text-gray-400"><tr><th class="text-left py-1">Field</th><th class="text-center py-1">Expected</th><th class="text-center py-1">Actual</th></tr></thead>
            <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
              ${c.fields.map(f => `<tr class="${f.mismatch ? 'bg-red-50 dark:bg-red-900/20' : ''}">
                <td class="py-1 font-mono font-semibold ${f.mismatch ? 'text-red-700 dark:text-red-400' : 'dark:text-gray-300'}">${escapeHtml(f.field)}</td>
                <td class="py-1 text-center">${badge(f.expected)}</td>
                <td class="py-1 text-center">${badge(f.actual)}${f.mismatch ? ' ⚠' : ''}</td>
              </tr>`).join('')}
            </tbody>
          </table>` : '<p class="text-xs text-gray-400 dark:text-gray-500 mt-2">No field checks</p>';
        return `<div class="bg-white dark:bg-gray-800 rounded-lg shadow border-l-4 ${isPass ? 'border-green-300 dark:border-green-600' : 'border-red-300 dark:border-red-600'} p-4">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-xs font-mono text-gray-400 dark:text-gray-500">${escapeHtml(c.id)}</span>
              <p class="font-medium text-sm mt-0.5 dark:text-gray-200">${escapeHtml(c.description)}</p>
            </div>
            <span class="ml-4 px-2 py-0.5 rounded text-xs font-bold ${isPass ? 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300' : 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300'}">${escapeHtml(c.status)}</span>
          </div>
          <div class="mt-2 text-xs grid grid-cols-2 gap-2">
            <div class="${!flowMatch ? 'text-red-600 dark:text-red-400 font-semibold' : 'dark:text-gray-400'}">Flow (expected): <span class="font-mono">${escapeHtml(c.expectedFlowStep)}</span></div>
            <div class="${!flowMatch ? 'text-red-600 dark:text-red-400 font-semibold' : 'dark:text-gray-400'}">Flow (actual): <span class="font-mono">${escapeHtml(c.actualFlowStep)}</span></div>
          </div>
          ${fieldsHtml}
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
