<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test — IUA/SMART Validator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-gray-800 text-white px-6 py-3 flex items-center gap-6">
    <span class="font-bold">IUA/SMART Validator</span>
    <a href="/dashboard.html" class="hover:text-gray-300">Dashboard</a>
    <a href="/results.html" class="hover:text-gray-300">Results</a>
    <a href="/validate.html" class="hover:text-gray-300">Validate</a>
    <a href="/rules.html" class="hover:text-gray-300">Rules</a>
    <a href="/settings.html" class="ml-auto hover:text-gray-300">Settings</a>
    <a href="/test.html" class="text-blue-300 font-medium">Test</a>
    <button onclick="logout()" class="text-sm hover:text-gray-300">Logout</button>
  </nav>

  <div class="max-w-5xl mx-auto p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold">測試腳本執行</h2>
      <button onclick="runTests()" id="run-btn"
        class="bg-blue-600 text-white px-5 py-2 rounded font-medium hover:bg-blue-700 transition">
        執行測試
      </button>
    </div>

    <!-- Summary -->
    <div id="summary" class="hidden bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-3 gap-4 text-center">
      <div>
        <div id="sum-total" class="text-3xl font-bold text-gray-800">—</div>
        <div class="text-gray-500 text-sm">Total</div>
      </div>
      <div>
        <div id="sum-pass" class="text-3xl font-bold text-green-600">—</div>
        <div class="text-gray-500 text-sm">Passed</div>
      </div>
      <div>
        <div id="sum-fail" class="text-3xl font-bold text-red-600">—</div>
        <div class="text-gray-500 text-sm">Failed</div>
      </div>
    </div>

    <!-- Cases -->
    <div id="cases-section" class="space-y-3"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login.html';

    async function apiFetch(url, opts = {}) {
      const res = await fetch('/api' + url, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
      });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = '/login.html'; return null; }
      return res.json();
    }

    async function logout() {
      await apiFetch('/auth/logout', { method: 'POST' });
      localStorage.removeItem('token');
      location.href = '/login.html';
    }

    async function runTests() {
      const btn = document.getElementById('run-btn');
      btn.disabled = true;
      btn.textContent = '執行中…';

      const report = await apiFetch('/test/run', { method: 'POST' });
      btn.disabled = false;
      btn.textContent = '執行測試';
      if (!report) return;

      document.getElementById('sum-total').textContent = report.total;
      document.getElementById('sum-pass').textContent = report.passed;
      document.getElementById('sum-fail').textContent = report.failed;
      document.getElementById('summary').classList.remove('hidden');

      const container = document.getElementById('cases-section');
      container.innerHTML = report.cases.map(c => {
        const passBorder = c.status === 'PASS' ? 'border-green-300' : 'border-red-300';
        const passBg = c.status === 'PASS' ? 'bg-green-50' : 'bg-red-50';
        const flowMatch = c.expectedFlowStep === c.actualFlowStep;

        const fieldsHtml = c.fields.length > 0 ? `
          <table class="w-full text-xs mt-3">
            <thead class="text-gray-500">
              <tr>
                <th class="text-left py-1">Field</th>
                <th class="text-center py-1">Expected</th>
                <th class="text-center py-1">Actual</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${c.fields.map(f => `
                <tr class="${f.mismatch ? 'bg-red-50' : ''}">
                  <td class="py-1 font-mono font-semibold ${f.mismatch ? 'text-red-700' : ''}">${f.field}</td>
                  <td class="py-1 text-center">${badge(f.expected)}</td>
                  <td class="py-1 text-center">${badge(f.actual)}${f.mismatch ? ' ⚠' : ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="text-xs text-gray-400 mt-2">No field checks</p>';

        return `
          <div class="bg-white rounded-lg shadow border-l-4 ${passBorder} p-4">
            <div class="flex items-start justify-between">
              <div>
                <span class="text-xs font-mono text-gray-400">${c.id}</span>
                <p class="font-medium text-sm mt-0.5">${c.description}</p>
              </div>
              <span class="ml-4 px-2 py-0.5 rounded text-xs font-bold ${c.status === 'PASS' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${c.status}</span>
            </div>
            <div class="mt-2 text-xs grid grid-cols-2 gap-2">
              <div class="${!flowMatch ? 'text-red-600 font-semibold' : ''}">
                Flow (expected): <span class="font-mono">${c.expectedFlowStep}</span>
              </div>
              <div class="${!flowMatch ? 'text-red-600 font-semibold' : ''}">
                Flow (actual): <span class="font-mono">${c.actualFlowStep}</span>
              </div>
            </div>
            ${fieldsHtml}
          </div>
        `;
      }).join('');
    }

    function badge(status) {
      const colors = { PASS: 'bg-green-100 text-green-700', FAIL: 'bg-red-100 text-red-700', SKIP: 'bg-gray-100 text-gray-600' };
      return `<span class="px-1.5 py-0.5 rounded font-medium ${colors[status] || ''}">${status}</span>`;
    }
  </script>
</body>
</html>
