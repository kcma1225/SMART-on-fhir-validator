services:

  smart-on-fhir-validator-nginx:
    image: nginx:alpine
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      API_PORT: ${API_PORT:-3000}
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./src/ui:/usr/share/nginx/html:ro
    command: >
      /bin/sh -c "envsubst '$$API_PORT $$BASE_PATH' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - smart-on-fhir-validator-validator
    restart: unless-stopped
    networks:
      - twcat26

  smart-on-fhir-validator-validator:
    build: .
    expose:
      - "3000"
    environment:
      PRISM_DATABASE_URL: ${PRISM_DATABASE_URL:-}
      BASE_URL: ${BASE_URL:-}
      VALIDATOR_DATABASE_URL: postgresql://${VALIDATOR_DB_USER:-validator}:${VALIDATOR_DB_PASSWORD}@${VALIDATOR_DB_HOST:-postgres}:${VALIDATOR_DB_PORT:-5432}/${VALIDATOR_DB_NAME:-validator}?sslmode=disable
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      API_PORT: ${API_PORT:-3000}
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      smart-on-fhir-validator-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - twcat26

  smart-on-fhir-validator-postgres:
    image: postgres:16-alpine
    expose:
      - "${VALIDATOR_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${VALIDATOR_DB_USER:-validator}
      POSTGRES_PASSWORD: ${VALIDATOR_DB_PASSWORD}
      POSTGRES_DB: ${VALIDATOR_DB_NAME:-validator}
      PGPORT: ${VALIDATOR_DB_PORT:-5432}
    volumes:
      - smart-on-fhir-validator-:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VALIDATOR_DB_USER:-validator} -p ${VALIDATOR_DB_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - twcat26
volumes:
  smart-on-fhir-validator-:


networks:
  twcat26:
    external: true
