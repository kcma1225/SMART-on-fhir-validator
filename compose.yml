services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/ui:/usr/share/nginx/html:ro
    depends_on:
      - validator
    restart: unless-stopped

  validator:
    build: .
    expose:
      - "3000"
    environment:
      PRISM_DATABASE_URL: ${PRISM_DATABASE_URL:-}
      VALIDATOR_DATABASE_URL: postgresql://validator:${VALIDATOR_DB_PASSWORD}@postgres:5432/validator?sslmode=disable
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      API_PORT: ${API_PORT:-3000}
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: ${VALIDATOR_DB_PASSWORD}
      POSTGRES_DB: validator
    volumes:
      - validator_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  validator_db:
